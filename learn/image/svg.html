<hr>
<h2>SVG Ellipse</h2>
<svg xmnls="http://www.w3.org/2000/svg" width="200" height="200" style="border: 1px solid #ccc;">
    <ellipse id="ell1" cx="100" cy="100" rx="98" ry="98" fill="#FF11" stroke="black"></ellipse>
    <ellipse id="ell2" cx="100" cy="100" rx="98" ry="88" fill="#FF11" stroke="black"></ellipse>
    <ellipse id="ell3" cx="100" cy="100" rx="98" ry="78" fill="#FF11" stroke="black"></ellipse>

    <ellipse id="ell7" cx="100" cy="100" rx="98" ry="38" fill="#FF11" stroke="black"></ellipse>
    <ellipse id="ell8" cx="100" cy="100" rx="98" ry="28" fill="#FF11" stroke="black"></ellipse>
    <ellipse id="ell9" cx="100" cy="100" rx="98" ry="18" fill="#FF11" stroke="black"></ellipse>
    <ellipse id="ell10" cx="100" cy="100" rx="98" ry="8" fill="#FF11" stroke="black"></ellipse>

</svg>

<hr>
<h2>SVG Texte</h2>
<svg xmnls="http://www.w3.org/2000/svg" style="border: 1px solid #ccc;">
    <text x="10" y="20" >This is me !</text>
</svg>
<svg xmnls="http://www.w3.org/2000/svg" style="border: 1px solid #ccc;">
    <text x="100" y="120" font-size="20px" fill="red">This is me !</text>
</svg>

<!-- un texte -->

<hr>
<svg xmnls="http://www.w3.otg/2000/svg" style="border: 1px #ccc solid;">
    <polygon 
    points="60, 20, 240, 20, 280, 120, 20, 120"
    fill="#fd5f5f"
    stroke="black"></polygon>
    <text x="60" y="75" fill="white" font-size="20px"> This is a svg trapezium</text>
</svg>
