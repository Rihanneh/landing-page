<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Base HTML eco-friendly pour les images</title>
</head>

<body>

    <!-- ✅ BONNE PRATIQUE : dimensions spécifiées, format moderne, lazy loading -->
    <img src="image-optimisee.webp" alt="Description précise" width="800" height="600" loading="lazy">

    <!-- MAUVAISE PRATIQUE : dimensions non spécifiées, format lourd -->
    <img src="image-non-optimisee.jpeg" alt="Description">



    <!-- Images responsives avec la balise picture (multi-formats) -->
    <picture>
        <source srcset="image.avif" type="image.avif">
        <source srcset="image.webp" type="image.webp">
        <img src="image.jpg" alt="Description précise" width="800" height="600" loading="lazy">
    </picture>

    <!-- Images responsives avec srcset (multi-tialles) -->
    <img src="image-800w.webp" alt="Description précise"
        sizes="(max-width: 600px) 400px, (max-width : 1200px) 800px, 1200px"
        srcset="image-400w.webp 400w, image-800w.webp 800w, image-1200w.webp 1200w" width="800" height="600"
        loading="lazy">


    <!-- combinaisons des deux approches (format + taille) -->

    <picture>
        <!-- AVIF en différentes tailles -->
        <source sizes="(max-width: 600px) 400px, (max-width : 1200px) 800px, 1200px"
            srcset="image-400w.avif 400w, image-800w.avif 800w, image-1200w.avif 1200w" type="image/avif">

        <!-- webP en différentes tailles -->
        <source sizes="(max-width: 600px) 400px, (max-width : 1200px) 800px, 1200px"
            srcset="image-400w.webp 400w, image-800w.webp 800w, image-1200w.webp 1200w" type="image/webp">

        <!-- JPEG en différentes tailles -->
        <img src="image-800w.jpg" alt="Description précise" 
            sizes="(max-width: 600px) 400px, (max-width : 1200px) 800px, 1200px"
            srcset="image-400w.jpg 400w, image-800w.jpg 800w, image-1200w.jpg 1200w" type="image/jpg"
            width="800" height="600" loading="lazy">

    </picture>

</body>


</html>
