<h2>SVG Circle</h2>

    <!-- des Polygones -->

    <!-- un trapèze -->

    <hr>
<h2> SVG Polygones
</h2>
<svg xmnls="http://www.w3.otg/2000/svg" style="border: 1px #ccc solid;">
    <polygon 
    points="60, 20, 240, 20, 280, 120, 20, 120"
    fill="#fd5f5f"
    stroke="black"></polygon>
    <text x="60" y="75" fill="white" font-size="20px"> This is a svg trapezium</text>
</svg>

    <!-- un pentagone -->
    <svg xmnls="http://www.w3.org/2000/svg" style="border: 1px solid #ccc">
      <polygon
        points="150, 20 200,60 180,110 120,110 100, 60"
        fill="teal"
        stroke="black"
      ></polygon>
      <!-- étoile -->
      <polygon
        points="150, 20 180,110 100, 60 200,60 120,110"
        fill="blue"
        fill-rule="evenodd"
        stroke="yellow"
      ></polygon>

      <text x="70" y="130" font-size="18px">This is a SVF Pentagon</text>
    </svg>

    <!-- une étoile -->
    <svg xmnls="http://www.w3.org/2000/svg" style="border: 1px solid #ccc">
      <polygon
        points="150, 25 180,110 100, 60 200,60 120,110"
        fill="blue"
        fill-opacity="0.4"
        stroke="black"
      ></polygon>
      <text x="85" y="130" font-size="18px">This is a SVF star</text>
    </svg>

    <!-- une étoile avec l'attribut fill-rule -->
    <svg xmnls="http://www.w3.org/2000/svg" style="border: 1px solid #ccc">
      <polygon
        points="150, 25 180,110 100, 60 200,60 120,110"
        fill="yellow"
        fill-rule="evenodd"
        stroke="black"
      ></polygon>
      <text x="5" y="130" font-size="18px">
        This is a SVF star with fill-rule evenodd
      </text>
    </svg>

    <!-- SVG Animation -->
    <hr> 
<h2>SVG Animation</h2>
   <svg xmnls="http://www.w3.org/2000/svg" style="border: 1px solid #ccc;">
        <circle cx="150" cy="75" r="25" fill="red">
            <animate attributeName="cy" from="-20" to="200" dur="2s" repeatCount="indefinite" />
        </circle>
        <circle cx="150" cy="75" r="25" fill="blue">
            <animate attributeName="cx" from="-20" to="300" dur="2s" fill="freeze"/>
        </circle>
    </svg>

    <svg xmnls="http://www.w3.org/2000/svg" style="border: 2px solid #000;">
        <rect x="10" y="10" width="280" height="130" fill="white" stroke="black" stroke-width="3"></rect>
      <circle cx="10" cy="10" r="10" fill="teal">
        <animateMotion path="M 0 0 H280 V130  H0 Z "
        dur="4s" repeatCount="indefinite"/>
      </circle>
    </svg>

    <h2>SVG Umbrella</h2>

      ></polygon>
      <polygon
        points=" 100,0 180,70 120,75"

        fill-opacity="0,1"
      ></polygon>
      <polygon
        points=" 100,0 120,75 80,75"

        stroke="white"
      ></polygon>
      <polygon
        points=" 100,0 80,75 20,70 "
        fill="violet"
        stroke="white"
      ></polygon>
      <polygon
        points=" 100,0 20,70 0,65 "

      ></polygon>
      <line
        x1="100"
        y1="0"
        x2="100"
        y2="160"
        stroke="black"
        stroke-width="3"
      ></line>
      <path
        d="M 100 159 q 0 45 -25 0 "
        fill="none"
        stroke="black"
        stroke-width="3"
      ></path>
